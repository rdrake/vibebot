[project]
name = "vibebot-v8"
version = "0.1.0"
description = "VibeBot v8 - Modern IRC bot with AI capabilities"
requires-python = ">=3.14"
dependencies = [
    "llm",
    "nickinmiddle",
    # Runtime dep for Limnoria's stock RSS plugin (not used by our workspace plugins).
    "feedparser>=6.0",
]

[tool.uv]
# A cooldown: nothing uploaded in the last week resolves. Both LiteLLM
# compromises (1.82.7/1.82.8, 1.107.0) were pulled within hours.
exclude-newer = "7 days"

[tool.uv.workspace]
members = ["plugins/llm", "plugins/nickinmiddle"]

[tool.uv.sources]
llm = { workspace = true }
nickinmiddle = { workspace = true }

[tool.ruff]
target-version = "py314"
line-length = 100
# Markdown code blocks are prose examples and archived plans, not code.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["plugins/llm/tests", "plugins/nickinmiddle/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
filterwarnings = [
    "error",                            # Treat project warnings as test failures
    "ignore::SyntaxWarning",               # PEP 765: return-in-finally (supybot)
    "ignore::DeprecationWarning:supybot",  # currentThread(), codecs.open()
    "ignore::ResourceWarning:supybot",     # Unclosed conf/*.conf files
    "ignore::ResourceWarning:tempfile",    # HTTPError cleanup on Python 3.14
    "ignore::ResourceWarning:sqlite3",     # Thread-local connection pool cleanup
    "ignore::pytest.PytestUnraisableExceptionWarning",  # GC-triggered ResourceWarning from thread-local conns
    "ignore::SyntaxWarning:supybot",       # return-in-finally (PEP 765)
]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
unresolved-import = "ignore"  # External deps (supybot) not in workspace
unresolved-attribute = "ignore"  # Supybot has no type stubs

[tool.coverage.run]
source = ["plugins/llm/src", "plugins/nickinmiddle/src"]
branch = true

[tool.coverage.report]
fail_under = 93
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mkdocs-llmstxt>=0.5.0",
    "mkdocs-material>=9.6",
    "prek>=0.4.4",
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.15.17",
    "ty>=0.0.49",
]
