repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # ruff runs from the project venv so the hook, `make check` and CI all
      # use the version uv.lock pins.
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: ty
        name: ty type checker
        entry: uv run ty check plugins/llm/src/ plugins/nickinmiddle/src/
        language: system
        pass_filenames: false
        types: [python]

      - id: pre-push-check
        name: pre-push lint, format-check, typecheck (CI owns the test suite)
        entry: make check-fast
        language: system
        pass_filenames: false
        stages: [pre-push]
