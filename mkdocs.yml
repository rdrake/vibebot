site_name: VibeBot
site_url: https://rdrake.github.io/vibebot-v8/
repo_url: https://github.com/rdrake/vibebot-v8
repo_name: rdrake/vibebot-v8
docs_dir: docs/guide
strict: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - llmstxt:
      markdown_description: >-
        VibeBot is a Limnoria IRC bot whose LLM plugin answers chat, draws,
        searches, schedules reminders and runs a shared-fiction
        "verse". These pages cover running and configuring it.
      full_output: llms-full.txt
      sections:
        Operator guide:
          - operator/installation.md
          - operator/operations.md
          - operator/configuration.md
          - operator/*.md
        Plugins:
          - plugins/*.md
        Reference:
          - reference/*.md
        User guide:
          - user/*.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - User guide:
    - Getting started: user/getting-started.md
    - AI commands: user/ai-commands.md
    - Memory and instructions: user/memory.md
    - Reminders: user/reminders.md
    - Scheduled tasks: user/scheduled-tasks.md
    - Service status: user/service-status.md
    - Aurora: user/aurora.md
  - Plugins:
    - Overview: plugins/index.md
    - LLM: plugins/llm.md
    - NickInMiddle: plugins/nickinmiddle.md
  - Operator guide:
    - Installation and deployment: operator/installation.md
    - Operations and auto-updates: operator/operations.md
    - Configuration: operator/configuration.md
    - The verse: operator/verse.md
    - Memory promotion: operator/memory-promotion.md
    - Rate limiting and security: operator/rate-limiting-security.md
    - Tuning and monitoring: operator/tuning-monitoring.md
    - Branch protection: operator/branch-protection.md
  - Reference:
    - Command reference: reference/commands.md
    - Bridge tools: reference/bridge-tools.md
