[project]
name = "nickinmiddle"
version = "0.1.0"
description = "Recognize the bot's nick in the middle of a message as addressing"
requires-python = ">=3.14"
dependencies = [
    "limnoria>=2023.1.20",
]

[project.entry-points."limnoria.plugins"]
NickInMiddle = "nickinmiddle"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nickinmiddle"]
